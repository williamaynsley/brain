r dash while platform stats look flat. Check the segment split before believing a blended number.", "sub": false}, {"term": "TOF / MOF / BOF", "body": "— top, middle, bottom of funnel. Cold strangers → considering → ready to buy. Each usually needs different creative.", "sub": false}, {"term": "Funnel feeder", "body": "— a *job*, not a campaign type: whatever brings new people in so MOF/BOF have someone to work on. In DTC ecom the best feeders are usually still **Sales**-objective prospecting — the creative does the introducing, the objective still says \"find buyers.\" ⚠️ **The excuse trap:** \"it's a funnel feeder\" gets used to wave away a bad number. Feeding the funnel means judged *differently*, not judged *never* — ask for cost per new customer or new-customer ROAS, and what it's supposed to be. A sub-1x feeder is fine if those buyers come back and lossy if they don't; the phrase alone doesn't tell you which (see *Segment split*).", "sub": false}, {"term": "Brand awareness (the objective)", "body": "— Meta's Awareness objective: optimises for reach and impressions, not buyers. Ask for cheap eyeballs and you get cheap eyeballs, often from people who'd never buy. Rare in DTC ecom — the real uses are launches, big budgets, and brands already converting well. ⚠️ Not the same as **Awareness level** (further down) — same word, unrelated idea.\n*Awareness is always TOF; TOF is not always awareness.* TOF is the **stage** (where the customer is); the objective is **what you ask Meta to optimise** at that stage. So \"is this TOF?\" and \"is this an awareness campaign?\" are two different questions — \"funnel feeder\" answers the first, not the second.", "sub": false}, {"term": "Placement", "body": "— where the ad appears: feed, Stories, Reels, Explore. \"Automatic placements\" lets Meta choose.", "sub": false}, {"term": "Optimisation event / conversion event", "body": "— the action Meta is told to chase: purchase, add to cart, lead. Ad-set level.", "sub": false}, {"term": "Bid strategy", "body": "— how Meta buys: lowest cost, cost cap, or a ROAS goal.", "sub": false}, {"term": "Learning phase", "body": "— the settling-in period after launch or a big edit, while Meta gathers data (roughly 50 conversions a week per ad set). Performance is unstable and unreliable during it. *Why it matters to you:* if a client panics at day-two numbers, this is usually the answer.", "sub": false}, {"term": "Advantage+ (and ASC — Advantage+ Shopping Campaign)", "body": "— Meta's automated campaign types. Broad targeting, machine-led placement and delivery. The direction the whole platform is heading.", "sub": false}, {"term": "Frequency", "body": "— average times one person has seen the ad. Climbing frequency with falling results = creative fatigue.", "sub": false}, {"term": "Delivery", "body": "— whether an ad is actually being shown, and how much. An ad can be \"active\" but barely delivering.", "sub": false}, {"term": "Auction", "body": "— the real-time bidding that decides which ad a person sees. Andromeda picks the candidates; the auction picks the winner.", "sub": false}, {"term": "Status: active / paused / archived", "body": "— running, stopped but recoverable, or shelved.", "sub": false}, {"term": "Duplicate", "body": "— copying an ad set or campaign to run elsewhere. Note: to scale a *winning ad*, push budget behind the existing ad rather than re-uploading the creative — the original keeps its engagement and history.", "sub": false}]}, {"title": "Tracking & measurement (how we know what worked)", "intro": "*The stack in one sentence: sensors on the site (tag / pixel / CAPI) feed the rulers (Meta, GA4, client dashboards), the rulers disagree in predictable ways, and the till (Shopify) settles the total.*", "entries": [{"term": "Shopify (as a measurement source)", "body": "— the client's store, i.e. **the till**. Not an ad channel: Meta and Google are where you *buy* traffic, Shopify is where it *lands and pays*. It reports what was actually sold — regardless of who claims credit — which makes it the anchor when ad platforms disagree. Also feeds the product catalog into Google Shopping / Meta dynamic ads.", "sub": false}, {"term": "UTM parameters", "body": "— tracking tags glued onto the end of a link so the destination site knows where the visitor came from. Everything after the `?` in\n`attngrace.com/products/pads?utm_source=facebook&utm_medium=paid&utm_campaign=q3_prospecting`.\nThe five tags: **utm_source** (who sent them: facebook, google, klaviyo), **utm_medium** (paid / email / organic), **utm_campaign**, **utm_content** (which ad variant), **utm_term** (search keyword). The name is a fossil (\"Urchin Tracking Module\" — the company that became Google Analytics); everyone just says UTM.\n*Why it matters:* client dashboards build their channel-split from these. **An ad launched with missing/misspelled UTMs gets its sales filed under \"direct/unknown\"** — the client's dash undercounts Meta, and someone ends up arguing about whose numbers are right. First check when a client says \"your ads barely show in our dash\": are our UTMs present and correct? (The platform can show an ad's URL tags and flag missing UTMs.)", "sub": false}, {"term": "GA4 — Google Analytics 4", "body": "— Google's free website-analytics tool: a script on the client's site recording every visit (source via UTMs, pages viewed, add-to-carts, purchases). The store's own security camera: sees *all* traffic on one consistent ruler — but it recognizes people by clicks and cookies, so iOS privacy and cross-device shopping make it lose the trail, especially for Meta.", "sub": false}, {"term": "Pixel (Meta Pixel)", "body": "— same species as the GA4 tag (a script on the site watching visitors) but it reports to **Meta**, and the data does double duty: attribution *and* feeding Meta's delivery algorithm (\"people like this buy\"). **Weak pixel = worse optimization = higher CPA** — pixel health is a performance issue, not just a reporting one. It's why audits start with Pixel/CAPI checks.", "sub": false}, {"term": "CAPI — Conversions API", "body": "— the Pixel's server-side sibling: the store's server (e.g. Shopify) sends purchase events straight to Meta, no browser involved — so iOS blockers and ad-blockers can't touch it. Well-set-up clients run Pixel + CAPI together, deduplicated. (Google has an equivalent: server-side tagging / enhanced conversions. Every platform is building the server route because browsers stopped being reliable witnesses.)", "sub": false}, {"term": "Attribution", "body": "— deciding which ad gets \"credit\" for a sale. The eternal source of number disagreements, because every system attributes differently: platforms count views and use their own models; GA4/client dashboards count clicks via UTMs and cookies.\nWhy GA4-style attribution undercounts Meta specifically: (1) **clicks-only** — Meta drives *view-through* sales (saw the ad, googled the brand later) that get filed under google/direct; (2) **iOS App Tracking Transparency** (2021) + Safari cookie limits cut the click trail; (3) **cross-device** — see the ad on the phone, buy on the laptop, thread lost.", "sub": false}, {"term": "The three rulers (which number to trust for what)", "body": "| Ruler | Bias | Use it for |\n|---|---|---|\n| Meta / Google's own numbers | **Over-claims** (grades its own homework, counts views) | Comparing campaigns *within* a channel |\n| GA4 / UTM-based dashboards | **Under-claims Meta** (clicks-only, iOS-broken) | Site behavior, trends, one consistent ruler across channels |\n| Shopify (the till) | Total truth, **no channel split** | Whether marketing overall pays — MER |\n\nNone is \"the real number.\" The skill is knowing which direction each one lies, and never comparing a number from one ruler against a number from another as if they were the same thing. When a client's dash and Meta disagree, that's usually two rulers doing what they always do — anchor the conversation on the Shopify number.", "sub": true}, {"term": "The attribution rows (which seat is the number coming from?)", "body": "Every attribution argument is between some pair of these four:\n\n| Row | Who | Bias / nature |\n|---|---|---|\n| **1. Players keeping their own score** | Meta's model, Google's model | Each sees only its own ads, counts views, grades its own homework — generous by construction |\n| **2. The free public scoreboard** | GA4 | Neutral-ish, one method for all channels — but click/cookie-based, so it shortchanges Meta (iOS) |\n| **3. The hired referee** | Triple Whale, Northbeam & friends (paid attribution tools) | Plugs into everything (Shopify orders + all channels + own pixel); the client *chooses the model* — an adjustable whistle |\n| **Outside the hood** | Shopify | Not a ruler — the till. Totals, no channel split |", "sub": true}, {"term": "Attribution tool (Triple Whale, Northbeam…)", "body": "— the paid row-3 category. Clients buy one precisely because rows 1 and 2 disagree. Key property: the model is a *setting* (Renzo's runs \"last platform click\"), so the first question is always *\"which model inside the tool?\"* — the referee's whistle is adjustable. When a client says \"our dash,\" it's almost always row 3 or a homemade spreadsheet.", "sub": false}, {"term": "The opening move for every \"your numbers don't match ours\" call:", "body": "*\"Which dashboard is that from, and how does it attribute — which model and window?\"* Establish what each side is measuring before debating whose result is right. The counter-move differs by row: row 1 → \"platforms over-claim, here's blended\"; row 2 → \"GA4 undercounts Meta by design\"; row 3 → \"which model is the dial set to?\"", "sub": false}, {"term": "Disagreement vs. break", "body": "— magnitude tells you which conversation you're in: **3.2 vs 1.9** = two honest models disagreeing → explain attribution, anchor on MER. **1.48 vs 0.02** = nobody's model differs that much → something's *broken* (dead API key, unsynced integration, stripped UTMs) → fix plumbing, don't philosophize. (From the Renzo's call — Marcus's habit worth stealing.)", "sub": false}]}, {"title": "Google-specific", "intro": "", "entries": [{"term": "PMax — Performance Max", "body": "— a Google campaign type that runs across all of Google (Search, Shopping, YouTube, Gmail, Display) from one asset set.", "sub": false}, {"term": "RSA — Responsive Search Ad", "body": "— you supply multiple headlines/descriptions and Google mixes them.", "sub": false}, {"term": "Shopping / Merchant Center", "body": "— product-listing ads (image, price, title). The **feed** is the product data behind them.", "sub": false}, {"term": "Impression Share", "body": "— the % of the times you *could* have shown vs. actually did. \"IS lost to budget\" over ~20% = you're leaving demand on the table because budget is too low.", "sub": false}]}, {"title": "Marketer.com world (internal)", "intro": "", "entries": [{"term": "Pod", "body": "— a small team owning a set of clients (e.g. Angus, Warehouse, Buffalo, Charolais, Belgian, Moskus). Pairs a front-end/client-facing person with a back-end operator.", "sub": false}, {"term": "CSM — Customer Success Manager", "body": "— keeps clients informed, happy, and growing. (Your track.)", "sub": false}, {"term": "Attio", "body": "— the CRM; where client + deal info lives.", "sub": false}, {"term": "Marketer.com platform", "body": "— Marketer's own ad-ops software. **Always pull performance numbers from here.**", "sub": false}, {"term": "Marketer MCP", "body": "— a connector that lets an AI (like Claude) read live account data so you can ask \"what's happening on my accounts?\" directly. MCP = Model Context Protocol: the standard plug between an AI and a piece of software (the USB-C of AI). Auth comes in two flavours — an **API key** (a secret string that is both identity and permission list) or **OAuth** (\"log in with your account\"). Troubleshooting rule: \"the MCP isn't working\" is two different problems — a **server** problem (the connector itself is down; even \"list what I can reach\" fails → ask whoever runs it) or a **scope** problem (connector healthy, but the key can't see the workspace you need → ask whoever owns the key). Knowing which saves a day of asking the wrong person.", "sub": false}]}, {"title": "Quick gut-checks", "intro": "- ROAS **≥ 1** = making money back; **< 1** = losing money. Alerts often fire when ROAS drops under a set threshold.\n- Rising **CPM** = attention getting more expensive (more competition or worse targeting).\n- Flat results for a week usually means **not enough testing** — the fix is more, faster creative tests.\n- Two numbers share a name but disagree? **Ask who owns the definition before arguing about the math.**\n- Someone says a metric \"fell off a cliff\"? First question: **fell relative to what?** Window and baseline before explanation — a cliff vs. a strong June is a different story than a cliff vs. July.\n- Blended CPA looks fine but the client says new customers are down? **Check the segment split** — budget may have drifted to existing customers.\n- Two dashboards wildly apart (1.48 vs 0.02)? **That's a break, not a disagreement** — check the plumbing (API key scopes, integration sync, UTMs) before explaining attribution.\n- **Blended = till ÷ invoices, never sum-of-claims.** Platform ROAS numbers don't enter the blended number at all (that's what makes it un-gameable) — but they're still what you use for ad-vs-ad decisions *inside* each channel.", "entries": []}, {"title": "Creative strategy (the Ember / Andromeda layer)", "intro": "", "entries": [{"term": "Hook", "body": "— the first thing that stops the scroll: opening line, opening image, first 2–3 seconds of a video. The single highest-leverage part of an ad. Most ads fail here, not later.", "sub": false}, {"term": "Thumbstop / hook rate", "body": "— the share of people who stop scrolling. A hook diagnostic: low hook rate means the opening is the problem, not the offer.", "sub": false}, {"term": "Variation vs. concept", "body": "— a *concept* is a new idea; a *variation* is the same idea re-skinned (new headline, same image). This distinction now decides performance — see Entity ID.", "sub": false}, {"term": "Andromeda", "body": "— Meta's ad retrieval engine. Before showing anyone an ad it narrows tens of millions down to ~1,000 candidates in a fraction of a second, reading your actual creative (image, audio, copy) to decide who sees it. Launched late 2024, rebuilt through 2025–26.\n*Why it matters to you:* the creative is now the targeting. It's the reason clients need volume **and** variety.", "sub": false}, {"term": "Entity ID", "body": "— how Meta groups near-identical ads. Fifty variations of one hook get treated as **one** entry competing for one slot, not fifty. The reason \"make more versions of our winner\" no longer works.\n⚠️ *The three layers, never to be mixed:* **Identity** = the ad's content (face) — fixed at birth, unaffected by placement or timing. **Collision** = twins meeting the same person at the auction — collapse happens per-impression, across ad sets and campaigns alike (\"containers control collision; content controls identity\"). **Strategy** = distinct ads with the same message don't multiply reach — same angle = same audience pocket = redundancy, not width. Twins are a tool when deliberate (different rooms, format adaptations, graduation copies), a fail only when counted as separate tests.", "sub": false}, {"term": "Creative diversity", "body": "— genuinely different ads: different problems, people, emotions, formats. Not different headlines on the same image. What Andromeda actually rewards.", "sub": false}, {"term": "Creative fatigue / creative ceiling", "body": "— every ad has a shelf life. Seen too often, people tune out: clicks drop, CPA climbs. More budget makes it worse, not better — it just shows a tired ad more often. The fix is fresh concepts, not more spend.", "sub": false}, {"term": "Winner / loser", "body": "— an ad that beats the account average, or doesn't. Winners get more budget; losers get killed and learned from.", "sub": false}, {"term": "Iteration", "body": "— the next ad built on *why* a winner won. Not a re-skin — a new execution exploiting the same insight.\nThe three-step ladder, in rising value: **variation** (same execution, cosmetic tweak — collapses into the same entity, ~worthless as a test) → **iteration** (new execution, same proven insight — a real test that compounds a win) → **new concept** (new insight — exploration). Example: winner = \"Lunchbox comes back half eaten?\" (picky-eater problem + review proof). Iterations: a UGC mom video on the same problem, a \"dinner standoff\" static, a before/after lunchbox shot. Variations: the same image in four colors. A fatigued winner retires as a *file* but lives on as iterations — the insight, the audience it caught (breakdowns), the winning hook line, and its ad-page pairing all feed the next brief. Revenue was the ad's salary; the learnings are its estate.", "sub": false}, {"term": "The seven iteration levers", "body": "(cheapest first; change **one per iteration** or you learn nothing —\nand Meta treats a big multi-change as a new entity restarting learning anyway):\n1. **Text variations** — extra primary-text/headline options inside the same ad; Meta rotates and\n   reports the winner. Nearly free; Marcus's default first move.\n2. **Hook swap** — new opening line/image, same everything else. The #1 fatigue-refresh lever:\n   the claim survives, the entrance gets repainted.\n3. **Format shift** — same message re-clothed: static → carousel → UGC video; lifestyle → flat-lay →\n   ingredients layout (see Renzo's names: Image_Lifestyle / Flat Lay / Layout_Ingredients).\n4. **Specificity step** — one branch down the angle tree: winner spoke to the problem *cluster*,\n   the iteration speaks to one *specific* problem in it (three sharp ads in three small pools beats\n   a fourth ad in one crowded pool).\n5. **Avatar swap** — same claim, different persona addressed (Hercules_Strong-Bones **Parent** →\n   same bones story aimed at a different buyer).\n6. **Proof swap** — same promise, new reason-to-believe: ingredient science ↔ testimonial ↔\n   us-vs-them (Renzo's Nobattle / UsvsThem ads).\n7. **Offer swap** — 25% off ↔ free sample ↔ subscription framing. ⚠️ Changes the *economics*, not\n   just the creative — never without the client's sign-off.\nWhich lever when: fatigued winner → 2 · scaling a hot angle family → 4 or 5 · always-on background\ntesting → 1 · strong angle, tired execution → 3 or 6.\n⚠️ Don't iterate a live winner \"as fast as possible\": every stacked iteration mines the same audience\npool and speeds up saturation (\"by iterating, we'll just meet that limit even quicker\" — Marcus, Renzo's\nwalkthrough 21 Aug 2026). Squeeze the winner with spend; point production speed at *neighboring*\nproblems; save the true iteration for succession when the winner fatigues. **A winner is a map, not a mold.**", "sub": false}, {"term": "Avatar / persona / sub-avatar", "body": "— the specific type of buyer an ad speaks to. One product usually has several. Different avatars = different concepts = more distinct creative.", "sub": false}, {"term": "Awareness level", "body": "— how much the buyer already knows: unaware → problem-aware → solution-aware → product-aware → most aware. Cold audiences need education; warm ones need an offer. ⚠️ Nothing to do with the **Brand awareness** *objective* under Campaign structure — that's a Meta setting, this is a state of mind.", "sub": false}, {"term": "Market sophistication", "body": "— how many similar claims the market has already heard. In a crowded market (\"stage 4–5\") plain benefit claims stop working and you need a new mechanism or new information.", "sub": false}, {"term": "Swipe file", "body": "— a saved library of ads that worked, used as reference when briefing new ones.", "sub": false}, {"term": "Batch", "body": "— a delivery of creatives, produced and reviewed as a set. Ember works in batches.", "sub": false}, {"term": "Rule of 1", "body": "— one audience, one problem, one promise per ad. Ads that try to say everything say nothing.", "sub": false}]}, {"title": "Design & production (what the creative team actually makes)", "intro": "", "entries": [{"term": "Static", "body": "— a still image ad. The workhorse format; usually the bulk of any batch.", "sub": false}, {"term": "Motion / motion graphics", "body": "— animated text and elements added to stills or video. Cheaper than filming, and it lifts attention.", "sub": false}, {"term": "UGC — User-Generated Content", "body": "— content that looks like a real person filmed it at home rather than a brand ad. Often outperforms polished work because it doesn't look like advertising.", "sub": false}, {"term": "AI UGC", "body": "— the same style generated with AI rather than a filmed creator. Faster and cheaper; quality depends entirely on human oversight.", "sub": false}, {"term": "Product shot / hero shot", "body": "— the product photographed cleanly, usually the main visual on an ad or product page.", "sub": false}, {"term": "Lifestyle shot", "body": "— the product in use, in a real setting, with people. Sells the feeling rather than the object.", "sub": false}, {"term": "Ghost mannequin / ghost image", "body": "— clothing photographed so it holds its shape with no visible model. Standard in fashion ecommerce.", "sub": false}, {"term": "Retouching", "body": "— cleaning up a photo after the shoot: colour, blemishes, background, consistency.", "sub": false}, {"term": "Colour grading", "body": "— setting the overall colour and mood of a video so a batch looks like it belongs to one brand.", "sub": false}, {"term": "B-roll", "body": "— supporting footage cut around the main shot to keep a video visually moving.", "sub": false}, {"term": "Storyboard", "body": "— the shot-by-shot plan for a video before anyone films or edits.", "sub": false}, {"term": "Aspect ratio", "body": "— the shape of the asset. `1:1` square, `4:5` portrait feed, `9:16` full-screen Stories and Reels. The same idea usually needs several.", "sub": false}, {"term": "Safe zone", "body": "— the area of a 9:16 asset that isn't covered by platform buttons and captions. Text outside it gets hidden.", "sub": false}, {"term": "Placement", "body": "— where an ad appears: feed, Stories, Reels, Explore. Different placements need different crops.", "sub": false}, {"term": "Resize / adaptation", "body": "— reworking one approved creative into the other ratios and placements. Volume, but not *new* volume — Meta may still read it as the same entity.", "sub": false}, {"term": "Master vs. variant", "body": "— the approved original versus the versions derived from it.", "sub": false}, {"term": "Copy overlay", "body": "— text placed on the image itself, as opposed to the ad copy beside it.", "sub": false}, {"term": "CTA — Call To Action", "body": "— the instruction: \"Shop now\", \"Get 20% off\".", "sub": false}, {"term": "Brand guidelines", "body": "— the rules: fonts, colours, logo use, tone of voice.", "sub": false}, {"term": "Brand kit / brand library", "body": "— the actual files: logos, fonts, approved photography, product images. What we need from a client before anyone can start.", "sub": false}, {"term": "Brand DNA", "body": "— the fuller picture of how a brand sounds and feels, beyond the file list. Often gathered at onboarding.", "sub": false}, {"term": "Source files / working files", "body": "— the editable originals (Figma, After Effects) rather than exported JPGs. Worth knowing whether a client is entitled to them — ask.", "sub": false}, {"term": "Mockup", "body": "— a rough version shown for direction before the work is finished.", "sub": false}]}, {"title": "The nine static concepts", "intro": "For still-image ads, a \"concept\" usually means the **visual format** — the kind\nof ad it is, not the wording. These nine read as genuinely different to Meta,\nand to a human scrolling. Same product, nine distinct ideas.\n\n1. **Product on plain background** — the product, clean, nothing else. Simple and it works.\n2. **Lifestyle** — the product in use, in a real setting, usually with a person.\n3. **Before and after** — the change the product makes, side by side.\n4. **Text-led statement** — words are the visual. A claim, a question, a bold line.\n5. **Review / testimonial screenshot** — a real customer's words, shown as they were written.\n6. **Comparison** — us versus the alternative, or versus doing nothing.\n7. **Ingredient / how-it-works** — breaking down what's in it or why it works.\n8. **UGC-style photo** — looks like a customer snapped it, not a brand shoot.\n9. **Offer-led** — the deal is the message.", "entries": [{"term": "Two uses for this list:", "body": "- *Judging a batch.* 20 statics is not automatically 20 entries. It might be 5\n  concepts with 4 variations each. Count concepts, not assets.\n- *Unblocking a client* who says \"I don't know what else we'd make.\" Walk the\n  list — most brands have only ever tried two or three of these.", "sub": false}, {"term": "What does NOT make a new concept:", "body": "a new headline, a colour swap on the same\ntemplate, a re-crop, or the same photo with different overlay text. See\n*Entity ID*.", "sub": false}]}, {"title": "Creative workflow (how a batch actually moves)", "intro": "", "entries": [{"term": "Brief", "body": "— the instruction to the designer: the angle, audience, format, message.", "sub": false}, {"term": "Counter-brief", "body": "— the team's written-back version of the brief, confirming what they understood before producing. Catches misunderstandings while they're free to fix.", "sub": false}, {"term": "Revision round", "body": "— one cycle of client feedback and rework. Usually capped (Ember: 3 per asset) — check the client's agreement.", "sub": false}, {"term": "Feedback loop", "body": "— the back-and-forth that teaches the team a brand. Slow or vague feedback is the most common reason early batches miss.", "sub": false}, {"term": "Approval", "body": "— sign-off that an asset can run. Ask who holds it and how fast they move.", "sub": false}, {"term": "Deliverable", "body": "— a specific thing promised: \"20 statics, 2 videos\".", "sub": false}, {"term": "Turnaround", "body": "— time from brief to delivery. Ember: 24–72 hours.", "sub": false}, {"term": "Scope / scope creep", "body": "— what's included, and work quietly expanding past it. Watch for it; it's how a profitable account becomes unprofitable.", "sub": false}, {"term": "Frame.io", "body": "— where creative gets reviewed and commented on frame by frame. Every Ember client has a project.", "sub": false}, {"term": "Figma", "body": "— the design tool. Also where client-facing decks live.", "sub": false}]}, {"title": "Landing pages & the post-click world", "intro": "", "entries": [{"term": "LP — Landing Page", "body": "— the page a user hits *after* clicking the ad. Half the performance equation, and the half we usually don't control.", "sub": false}, {"term": "Ad-to-LP match", "body": "(message match) — does the page deliver what the ad promised? Ad says \"50% off styling tools\", LP shows full-price shampoo → conversion dies. The most common LP problem.", "sub": false}, {"term": "Dedicated LP", "body": "— a page purpose-built for one angle or one avatar, instead of the generic product page.", "sub": false}, {"term": "CVR — Conversion Rate", "body": "— % of visitors who buy. The LP's headline metric.", "sub": false}, {"term": "Bounce", "body": "— landed and left without acting.", "sub": false}, {"term": "Advertorial", "body": "— a long, article-style LP that educates before it sells. Heavily used for problem-aware audiences who aren't ready for a product pitch.", "sub": false}, {"term": "LP speed", "body": "— load time. Past roughly 3 seconds you bleed mobile traffic before the page even renders.\n\n*Why it matters to you:* when numbers dip, the cause is often on the client's side. \"Your landing page is the problem\" reads as blame-shifting. Better: *\"the ads are getting cheap clicks, but people drop off before checkout — can we look at the page together?\"* Same message, keeps you on the same team.", "sub": false}]}, {"title": "Video & scripts", "intro": "", "entries": [{"term": "Script", "body": "— the written plan for a video ad: what's said, what's shown, in what order. A static has *copy*; a video has a *script*. Usually two columns — **audio** (voiceover / spoken lines) beside **visual** (what's on screen), sometimes timecoded.", "sub": false}, {"term": "Hook", "body": "— the first 0–3 seconds. The line or image that stops the scroll. Carries most of the ad's success or failure.", "sub": false}, {"term": "Hook variants", "body": "— same script body, several different openings, tested against each other. The cheapest way to find a winner.", "sub": false}, {"term": "UGC — User-Generated Content", "body": "— creator-filmed footage made to feel organic rather than advertised. A \"UGC script\" is written to be performed to camera.", "sub": false}, {"term": "Google Ads \"scripts\"", "body": "— ⚠️ different thing entirely: JavaScript automation snippets running inside a Google Ads account (pausing broken keywords, flagging budget spikes). Context makes it clear, but the name collision catches beginners.\n\n*Why it matters to you:* when a client asks \"what's next?\", the answer is usually a new script or a hook variant. And when a client wants to approve creative before production, the script is what you send — far cheaper to kill a bad idea on paper than after a shoot.", "sub": false}]}, {"title": "Audits & diagnostics", "intro": "", "entries": [{"term": "Audit", "body": "— a systematic gap-hunt through an ad account: what's misconfigured, what's wasting money, what could be better. Norwegian: *revisjon / gjennomgang*.\nTwo situations: on a **prospect** (free review that becomes the sales argument), or on an **existing client** who's underperforming (find the cause before promising a fix).\nTypical checks: is tracking correct (Pixel/CAPI)? is spend going to non-converting terms or audiences? is the structure sane or spread across 40 campaigns? are creatives fatigued?", "sub": false}, {"term": "Health score", "body": "— the 0–100 output of the in-house diagnostics, so an audit lands as a number a client can act on.", "sub": false}, {"term": "Audit trail", "body": "— unrelated sense: the log of who changed what, when.\n\n*In-house tools:* `csm-ops:audit-generator` (branded PDF from screenshots or CSV), `google-ads:google-diagnostic` and `meta-ads:meta-diagnostic` (80+ / 50+ automated checks, live from MotherDuck for active clients).\n\n\nSee also: [frameworks.md](frameworks.md) — the strategic frameworks these metrics get argued about inside.", "sub": false}]}], "built": "2026-09-01"};</script>
<script>
const B=window.BRAIN, M=document.getElementById('main'), NF=document.getElementById('navFound');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(t){t=esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>');
  return t.split(/\n\n+/).map(b=>{const L=b.split('\n');
    return L.every(l=>/^\s*[-*] /.test(l))?'<ul>'+L.map(l=>'<li>'+l.replace(/^\s*[-*] /,'')+'</li>').join('')+'</ul>'
      :'<p>'+L.join('<br>')+'</p>';}).join('');}

B.foundations.filter(z=>z.zone!=='operating').forEach(z=>{const b=document.createElement('button');b.dataset.p='f-'+z.zone;b.textContent=z.title;NF.appendChild(b);});

function foundPane(z){return `<div class="pane" id="p-f-${z.zone}"><div class="phead"><div class="k">Foundations</div>
  <h2>${esc(z.title)}</h2><p>${esc(z.blurb)}</p></div>
  ${z.cards.map(c=>`<div class="card"><div class="top"><h3>${esc(c.h)}</h3>
    <span class="badge b-${c.conf}">${c.conf}</span></div>${md(c.body)}
    ${c.watch?`<div class="watch">${md(c.watch)}</div>`:''}
    <div class="src">Source: ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.src)}</a>`:esc(c.src)}</div>
  </div>`).join('')}</div>`;}

function notesBlock(zone,cmd){const n=B.notes[zone]||[];
  if(!n.length)return `<div class="empty">Nothing here yet.<br><br>Add one: <code>brain add ${zone} "title" "body"</code><br>
    <span class="hint">or just tell Claude &mdash; it writes these for you.</span></div>`;
  return n.map(x=>`<div class="note"><h3>${esc(x.title)}</h3>${md(x.body)}
    <div class="m">${esc(x.date)} &middot; ${esc(x.file)}</div></div>`).join('');}

const panes=[
  ...B.foundations.map(foundPane),
  `<div class="pane" id="p-brainstorm"><div class="phead"><div class="k">Think</div><h2>Brainstorm</h2>
    <p>Half-formed thoughts, questions, things that don't fit anywhere yet. No structure required &mdash; that's the point.</p></div>
    ${notesBlock('brainstorm')}</div>`,

  `<div class="pane" id="p-test"><div class="phead"><div class="k">Test</div><h2>Drills &amp; ledger</h2>
    <p>Two things. Drills test whether you actually understand something &mdash; commit an answer before you reveal, or it doesn't count. The ledger is where real ad tests go.</p></div>
   <div class="tabs"><button class="on" data-s="drills">Drills</button><button data-s="ledger">Live test ledger</button></div>
   <div class="sub on" id="s-drills">
     <p class="hint" style="margin-bottom:18px">Write your answer first. The reveal button stays locked until you do &mdash; reading the answer cold teaches you nothing.</p>
     ${B.drills.map((d,i)=>`<div class="drill"><div class="q">${esc(d.q)}</div>
       <textarea id="ta${i}" placeholder="Your answer. Rough is fine &mdash; commit to something."></textarea>
       <div class="row"><button class="btn" id="rv${i}" disabled>Reveal</button>
       <span class="tag">${esc(d.tag)}</span><span class="hint" id="hn${i}">write something first</span></div>
       <div class="ans" id="an${i}">${md(d.a)}</div></div>`).join('')}
   </div>
   <div class="sub" id="s-ledger">
     <p class="hint" style="margin-bottom:16px">Real tests on real accounts: what you predicted, what happened, what you'd do differently. Predicting before you look is the whole value &mdash; it's how you find out if your model of the world is right.</p>
     ${notesBlock('tests')}</div></div>`,

  `<div class="pane" id="p-play"><div class="phead"><div class="k">Playground</div><h2>Numbers &amp; scratch</h2>
    <p>Push numbers around until they mean something. Nothing here touches a real account.</p></div>
   <div class="tabs"><button class="on" data-s="calc">Calculators</button><button data-s="split">Budget splitter</button>
     <button data-s="live">Live data</button><button data-s="scratch">Scratch</button></div>

   <div class="sub on" id="s-calc">
     <div class="calc"><h3>Break-even ROAS</h3>
       <div class="why">The number that turns a ROAS into a decision. Below break-even you lose money on every order, however good the ROAS looks.</div>
       <div class="fields"><div class="f"><label>Gross margin %</label><input type="number" id="m1" value="75" min="1" max="99"></div></div>
       <div class="out" id="o1"></div></div>

     <div class="calc"><h3>Will this ad set ever learn?</h3>
       <div class="why">Meta needs ~50 optimisation events in a rolling 7 days to leave the learning phase. This tells you whether your budget can physically get there.</div>
       <div class="fields">
         <div class="f"><label>Daily budget</label><input type="number" id="b2" value="124"></div>
         <div class="f"><label>Cost per purchase</label><input type="number" id="c2" value="60"></div>
       </div><div class="out" id="o2"></div></div>

     <div class="calc"><h3>MER vs platform ROAS</h3>
       <div class="why">Platforms each claim the same sale. MER uses total revenue over total spend, so it can't double-count. This shows the gap.</div>
       <div class="fields">
         <div class="f"><label>Total revenue</label><input type="number" id="r3" value="30000"></div>
         <div class="f"><label>Total ad spend</label><input type="number" id="s3" value="5308"></div>
         <div class="f"><label>Meta claims revenue</label><input type="number" id="m3" value="18000"></div>
         <div class="f"><label>Google claims revenue</label><input type="number" id="g3" value="16000"></div>
       </div><div class="out" id="o3"></div></div>
   </div>

   <div class="sub" id="s-split">
     <div class="calc"><h3>Budget splitter</h3>
       <div class="why">Split a monthly budget across channels and campaigns, and see which cells can actually gather enough signal to optimise. This is the EquaVetz question, made pokeable.</div>
       <div class="fields">
         <div class="f"><label>Monthly ad spend</label><input type="number" id="bs" value="5308"></div>
         <div class="f"><label>Cost per purchase</label><input type="number" id="bc" value="60"></div>
         <div class="f"><label>How many campaigns</label><input type="number" id="bn" value="4" min="1" max="12"></div>
       </div><div id="obs"></div></div>
   </div>

   <div class="sub" id="s-live">
     <p class="hint" style="margin-bottom:16px">A static page can't reach your ad accounts. But Claude can &mdash; these are prompts that pull real data. Click to copy, paste into Claude.</p>
     <div class="launch"><strong>What's actually running</strong>
       <div class="p">Using the Marketer platform, list every campaign for [client] with spend, ROAS and purchases for the last 14 days. Flag anything with spend but no conversions.</div></div>
     <div class="launch"><strong>Creative fatigue check</strong>
       <div class="p">For [client], show me ad-level performance over the last 30 days. Which creatives are declining, and how long have they been running?</div></div>
     <div class="launch"><strong>Where is the waste</strong>
       <div class="p">For [client], run an account audit. Show me spend that isn't producing conversions, broken by campaign and creative.</div></div>
     <div class="launch"><strong>Search terms reality check</strong>
       <div class="p">Pull the Google search terms report for [client], last 30 days. What are we paying for that we shouldn't be?</div></div>
   </div>

   <div class="sub" id="s-scratch">
     <p class="hint" style="margin-bottom:16px">Practice angles, hooks and copy. Nothing client-facing, nothing that has to be good.</p>
     ${notesBlock('scratch')}</div></div>`,

  `<div class="pane" id="p-glossary"><div class="phead"><div class="k">Reference</div><h2>Glossary</h2>
    <p>Plain-language first. Lives in <code>~/CSM Intern/reference/glossary.md</code> &mdash; edit it there and run <code>brain build</code>.</p></div>
   <div class="gsearch"><input type="search" id="gq" placeholder="Search terms and definitions&hellip;" autocomplete="off">
     <div class="gcount" id="gc"></div></div>
   <div id="glist">${B.glossary.map(sec=>`<div class="gsec" data-sec>
     <h3>${esc(sec.title)}</h3>
     ${sec.intro?`<div class="intro">${md(sec.intro)}</div>`:''}
     ${sec.entries.map(e=>`<div class="gterm${e.sub?' sub':''}" data-term="${esc((e.term+' '+e.body).toLowerCase())}">
       <div class="t">${esc(e.term)}</div>${e.body?`<div class="d">${md(e.body)}</div>`:''}</div>`).join('')}
   </div>`).join('')}</div></div>`,

  `<div class="pane" id="p-about"><div class="phead"><div class="k">Meta</div><h2>How this works</h2></div>
   <div class="card"><h3>Confidence badges</h3>
     <p>Every claim carries how much you should trust it. This exists because I once filed a client's claim about her own company as "sourced" just because it was a direct quote. A quote proves someone said it, not that it's true.</p>
     <table><tr><th>Badge</th><th>Means</th></tr>
     <tr><td><span class="badge b-verified">verified</span></td><td>Checked against a primary source &mdash; the platform's own documentation</td></tr>
     <tr><td><span class="badge b-sourced">sourced</span></td><td>Stated in something real I read, but not a primary source</td></tr>
     <tr><td><span class="badge b-practitioner">practitioner</span></td><td>Craft from an experienced operator. No primary source exists &mdash; a strong prior, not a law.</td></tr>
     <tr><td><span class="badge b-claimed">claimed</span></td><td>Someone asserted it about their own business. Unchecked.</td></tr>
     <tr><td><span class="badge b-unverified">unverified</span></td><td>I could not confirm it. Don't repeat it to a client.</td></tr>
     <tr><td><span class="badge b-inferred">inferred</span></td><td>My reasoning. Stated nowhere.</td></tr></table></div>
   <div class="card"><h3>Adding to it</h3>
     <p>Files are the truth; this page is just a view. Nothing you write here is stored in the browser.</p>
     <ul><li><code>brain add brainstorm "title" "body"</code> &mdash; a thought</li>
     <li><code>brain add tests "title" "body"</code> &mdash; a live test result</li>
     <li><code>brain add scratch "title" "body"</code> &mdash; practice writing</li>
     <li><code>brain build</code> &mdash; regenerate after editing anything</li></ul>
     <p>Or just tell Claude. It writes these without being asked.</p>
     <p>Facts live in <code>content.json</code>. Correct one and run <code>brain build</code>.</p></div>
   <div class="card"><h3>What's missing</h3>
     <p>The Google AI Max change is marked <span class="badge b-unverified">unverified</span> &mdash; agency blogs say DSA campaigns auto-upgrade from September 2026, but Google's own announcements page didn't confirm it on 28 Aug 2026. Someone on the Google side of the pod should check.</p>
     <p>Andromeda/Lattice figures are agency reporting, not Meta primary. The direction is well-supported; the specific numbers aren't.</p><p>The <span class="badge b-practitioner">practitioner</span> cards in Google come from <strong>Google Ads Simplified</strong> on YouTube. Useful craft from someone who has run accounts for years &mdash; but one operator's experience, not documentation. If a card there ever contradicts something marked <span class="badge b-verified">verified</span>, the verified one wins.</p></div>
   <div class="card"><h3>Sister tools</h3>
     <p><code>csm status</code> &mdash; where every client engagement sits, and every open loop.<br>
     <code>~/CSM Intern/reference/</code> &mdash; your glossary, frameworks and course notes.<br>
     This is the third: where thinking happens before it becomes either of those.</p></div></div>`
].join('');
M.innerHTML=panes;

// nav
const nav=[...document.querySelectorAll('nav button')];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function go(id){const hit=document.getElementById('p-'+id);
  if(!hit)id='f-'+B.foundations[0].zone;
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));
  nav.forEach(b=>b.classList.toggle('on',b.dataset.p===id));
  store.set('brainPane',id);window.scrollTo(0,0);}
nav.forEach(b=>b.onclick=()=>go(b.dataset.p));
go(store.get('brainPane')||'f-'+B.foundations[0].zone);

// tabs
document.querySelectorAll('.tabs').forEach(t=>{const bs=[...t.querySelectorAll('button')];
  bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.toggle('on',x===b));
    t.parentElement.querySelectorAll('.sub').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.s));});});

// drills: locked until you commit
B.drills.forEach((d,i)=>{const ta=document.getElementById('ta'+i),rv=document.getElementById('rv'+i),
  an=document.getElementById('an'+i),hn=document.getElementById('hn'+i);
  ta.oninput=()=>{const ok=ta.value.trim().length>=15;rv.disabled=!ok;
    hn.textContent=ok?'':'write something first ('+Math.max(0,15-ta.value.trim().length)+' more characters)';};
  rv.onclick=()=>{an.classList.add('on');rv.disabled=true;hn.textContent='compare yours against it — where do they differ?';};});

// calculators
const $=id=>document.getElementById(id), num=id=>parseFloat($(id).value)||0;
function c1(){const m=num('m1')/100;if(m<=0||m>=1){$('o1').innerHTML='<div class="sm">Margin must be between 1 and 99.</div>';return;}
  const be=1/m;$('o1').className='out';
  $('o1').innerHTML=`<div class="big">${be.toFixed(2)}×</div><div class="sm">Break-even ROAS. Every order below this loses money.<br>
  A working scale target sits above it with headroom &mdash; often <strong>${(be*1.12).toFixed(2)}×</strong> to <strong>${(be*1.35).toFixed(2)}×</strong>, but that's a commercial call, not a formula.
  <br><span style="color:var(--ink3)">Note: this is gross margin only. Real break-even is higher once shipping, payment fees and returns come out &mdash; which is why people round it up. On the EquaCare call, 75% was called 1.35 rather than 1.33.</span></div>`;}
function c2(){const b=num('b2'),c=num('c2');if(c<=0){$('o2').innerHTML='<div class="sm">Enter a cost per purchase.</div>';return;}
  const wk=(b*7)/c,ok=wk>=50;const o=$('o2');o.className='out '+(ok?'good':'warn');
  o.innerHTML=`<div class="big">${wk.toFixed(1)}</div><div class="sm">purchases per week at this budget. Meta needs about <strong>50</strong>.<br>
  ${ok?'This can leave the learning phase.':`Short by <strong>${(50-wk).toFixed(1)}</strong>. To get there you'd need about <strong>${Math.ceil(50*c/7)}</strong>/day at this cost per purchase &mdash; or fewer, better-fed ad sets.`}</div>`;}
function c3(){const r=num('r3'),s=num('s3'),m=num('m3'),g=num('g3');if(s<=0){$('o3').innerHTML='<div class="sm">Enter ad spend.</div>';return;}
  const mer=r/s,claimed=m+g,over=claimed-r;$('o3').className='out';
  $('o3').innerHTML=`<div class="big">${mer.toFixed(2)}×</div><div class="sm">MER &mdash; total revenue &divide; total ad spend.<br>
  The platforms between them claim <strong>${claimed.toLocaleString()}</strong> against actual revenue of <strong>${r.toLocaleString()}</strong>
  ${over>0?`&mdash; an overlap of <strong>${over.toLocaleString()}</strong> (${(over/r*100).toFixed(0)}% double-counted).`:'&mdash; no overlap, which is unusual. Check tracking.'}</div>`;}
function bsplit(){const tot=num('bs'),cpp=num('bc'),n=Math.max(1,Math.min(12,parseInt($('bn').value)||1));
  if(cpp<=0){$('obs').innerHTML='<div class="out"><div class="sm">Enter a cost per purchase.</div></div>';return;}
  const daily=tot/30.4,per=daily/n,wk=(per*7)/cpp,dead=wk<50;
  let rows='';for(let i=1;i<=n;i++)rows+=`<tr class="${dead?'bad':'ok'}"><td>Campaign ${i}</td><td class="n">${per.toFixed(0)}/day</td>
    <td class="n">${wk.toFixed(1)}/wk</td><td class="n">${dead?'never learns':'learns'}</td></tr>`;
  const maxN=Math.floor((daily*7)/(50*cpp));
  const msg = maxN===0
    ? `Even a <strong>single</strong> campaign can't reach it at this cost per purchase &mdash; one would get ${((daily*7)/cpp).toFixed(1)}/week.
       Either cost per purchase has to come down, or you optimise for something cheaper and more frequent than Purchase
       (add-to-cart, say) so there's enough signal to learn from. That is a real strategy, not a workaround.`
    : (n>maxN ? `You've split it ${n} ways &mdash; <strong>${n-maxN} too many</strong>.` : 'Your split fits.');
  $('obs').innerHTML=`<div class="out ${dead?'warn':'good'}"><div class="big">${maxN}</div>
    <div class="sm">campaign${maxN===1?'':'s'} this budget can actually feed to the ~50/week threshold.<br>${msg}</div></div>
    <table><tr><th>Cell</th><th>Budget</th><th>Purchases</th><th>Verdict</th></tr>${rows}</table>
    <p class="hint" style="margin-top:12px">Rough model: assumes even splits and a flat cost per purchase. Reality is messier &mdash; but the direction holds, and the direction is the point.</p>`;}
['m1'].forEach(i=>$(i).oninput=c1);['b2','c2'].forEach(i=>$(i).oninput=c2);
['r3','s3','m3','g3'].forEach(i=>$(i).oninput=c3);['bs','bc','bn'].forEach(i=>$(i).oninput=bsplit);
c1();c2();c3();bsplit();

// glossary search
const gq=document.getElementById('gq'), gc=document.getElementById('gc');
const gterms=[...document.querySelectorAll('.gterm')], gsecs=[...document.querySelectorAll('[data-sec]')];
function gfilter(){
  const q=(gq.value||'').trim().toLowerCase();
  let hits=0;
  gterms.forEach(el=>{const on=!q||el.dataset.term.includes(q);
    el.classList.toggle('ghidden',!on); if(on)hits++;});
  gsecs.forEach(sec=>{const any=[...sec.querySelectorAll('.gterm')].some(e=>!e.classList.contains('ghidden'));
    sec.classList.toggle('ghidden',q&&!any);});
  gc.textContent = q ? `${hits} match${hits===1?'':'es'}` : `${gterms.length} terms`;
}
if(gq){gq.oninput=gfilter;gfilter();}

// copy prompts
document.querySelectorAll('.launch .p').forEach(p=>p.onclick=()=>{
  const t=p.textContent.trim();
  const done=()=>{p.classList.add('copied');setTimeout(()=>p.classList.remove('copied'),1600);};
  try{navigator.clipboard.writeText(t).then(done,()=>{})}catch(e){}
  done();});
</script></body></html>
